server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS — resolve API at request time (not boot),
  # so nginx starts even if the upstream hostname is briefly unavailable.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Same-origin API → SaaS API (cookies work on https://arc-tenders.tekia.gr)
  # Do NOT attach X-Frame-Options here — it would block PDF iframe/blob fallbacks
  # that embed authenticated /api/... downloads.
  location /api/ {
    set $api_upstream __API_UPSTREAM__;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    client_max_body_size 30m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location = /health {
    set $api_upstream __API_UPSTREAM__;
    proxy_pass http://$api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SEO crawl files must never fall through to the SPA shell
  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Social / search crawlers need static OG tags for /pro-30 (SPA SeoHead is client-only).
  # Humans still get the SPA shell via the default location /.
  location = /pro-30 {
    if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|TelegramBot|Googlebot|bingbot|Applebot|SkypeUriPreview)") {
      rewrite ^ /seo/pro-30.html last;
    }
    rewrite ^ /index.html last;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest|xml|txt)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
